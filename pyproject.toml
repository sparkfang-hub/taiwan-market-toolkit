[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "taiwan-market-toolkit"
version = "0.1.0"
description = "Open-source Python toolkit for Taiwan stock market data, trading calendars, OHLCV normalization, validation, and quantitative research utilities."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "sparkfang-hub"}]
keywords = ["taiwan", "stocks", "market-data", "ohlcv", "quant", "twse", "tpex"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Office/Business :: Financial",
]

dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.6",
]

[project.scripts]
tw-market = "taiwan_market_toolkit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/taiwan_market_toolkit"]

[tool.pytest.ini_options]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
