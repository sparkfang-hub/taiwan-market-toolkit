name: Probe TPEx corporate-action schema

on:
  pull_request:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Fetch current TPEx ex-right/ex-dividend schemas
        run: |
          python - <<'PY'
          import json
          import urllib.request

          for endpoint in ("tpex_exright_daily", "tpex_exright_prepost"):
              url = f"https://www.tpex.org.tw/openapi/v1/{endpoint}"
              req = urllib.request.Request(
                  url,
                  headers={"Accept": "application/json", "User-Agent": "taiwan-market-toolkit-schema-probe/0.1"},
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  payload = json.load(response)
              print(f"ENDPOINT={endpoint}")
              print(f"TYPE={type(payload).__name__} ROWS={len(payload) if isinstance(payload, list) else 'n/a'}")
              if isinstance(payload, list) and payload:
                  print("KEYS=" + json.dumps(sorted(payload[0].keys()), ensure_ascii=False))
                  print("SAMPLE=" + json.dumps(payload[0], ensure_ascii=False))
          PY
