name: Official source smoke check

on:
  workflow_dispatch:
  schedule:
    - cron: "30 1 * * 1"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install toolkit
        run: python -m pip install -e .
      - name: Probe official TWSE and TPEx sources
        run: python scripts/probe_official_sources.py
